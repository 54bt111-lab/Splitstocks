name: Run Reverse Split Bot

on:
  schedule:
    # 1. التشغيل اليومي لتقرير الصباح الساعة 07:03 صباحاً بتوقيت السعودية (04:03 UTC)
    - cron: '3 4 * * *'
    
    # 2. المتابعة كل 5 دقائق أثناء أوقات التداول للسوق الأمريكي (من 4:30 مساءً إلى 11:00 مساءً بتوقيت السعودية)
    # توازي من 13:30 إلى 20:00 بتوقيت UTC من الاثنين للجمعة
    - cron: '*/5 13-20 * * 1-5'

  workflow_dispatch: # يتيح لك التشغيل اليدوي في أي وقت للفيّس أو التجربة

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Reverse Split Search
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py
